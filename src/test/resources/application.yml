# Performance enhancements
server.compression:
  enabled: true
  mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  min-response-size: 1KB

---
spring:
  threads:
    virtual:
      enabled: true # Performance enhancements
  docker:
    compose:
      file: src/test/resources/dc/test-tools.yml
  application:
    name: store-test
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    show-sql: true
    open-in-view: false  # Important: Disable to catch lazy loading issues
    properties:
      hibernate:
        generate_statistics: true  # Required for QuickPerf
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
---
decorator:
  datasource:
    enabled: true
    datasource-proxy:
      count-query: true
      logging: slf4j
      query:
        log-slow-query: true
        slow-query-threshold: 300  # 300ms
        count-query: true
        log-level: debug
        enable-logging: true
      slow-query:
        enable-logging: true
        log-level: warn # Warning logs for the Slow Queries.

    flexy-pool:
      enabled: true
      acquisition-strategy:
        increment-pool:
          max-overgrow-pool-size: 15
      metrics:
        reporter:
          jmx:
            auto-start: true

quickperf:
  sql:
    display-sql-of-test-method-body: true
    disable-exactly-same-selects: false


logging:
  level:
    org.quickperf: DEBUG
    net.ttddyy.dsproxy.listener: DEBUG

# application.yml
sql-performance:
  tracking:
    enabled: true
    fail-fast-on-error: false
    log-queries: true

---
logging:
  level:
    log4j.category.Hypersistence-Optimizer: INFO

