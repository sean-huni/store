apiVersion: 1

providers:
  - name: 'SQL Performance Monitoring'
    orgId: 1
    folder: 'SQL Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true