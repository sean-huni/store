# Performance enhancements
server.compression:
  enabled: true
  mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  min-response-size: 1KB

---
# Default monitoring - Essential endpoints for observability
management:
  metrics:
    enable:
      hikaricp: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics  # Include essential monitoring endpoints
      base-path: /actuator
  endpoint:
    health:
      show-details: never  # Security best practice
    prometheus:
      enabled: true  # Essential for monitoring
    metrics:
      enabled: true  # Essential for monitoring
  prometheus:
    metrics:
      export:
        enabled: true  # Ensure Prometheus export is enabled
---
spring:
  application:
    name: store-app
  threads:
    virtual:
      enabled: true # Performance enhancements when platform thread is freed while the virtual thread parks. This improves scalability for blocking workloads.
  main:
    lazy-initialization: true # Performance enhancements for Lazy-Init by - reducing startup time by deferring bean instantiation; it can increase first-use latency and defer errors to runtime
  docker:
    compose:
      file: src/main/resources/dc/dev-env.yml
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        use_sql_comments: true
        # Enforce lazy loading globally
        enable_lazy_load_no_trans: false
        # Show SQL for debugging (disable in production)
        show_sql: false
        format_sql: true
        # Batch fetching optimization
        default_batch_fetch_size: 10
        # Enforce strict lazy loading
        bytecode:
          use_reflection_optimizer: false
        generate_statistics: true
    # Ensure lazy loading is default
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5433}/${DB_NAME:store}
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin}
    hikari:
      register-mbeans: true  # Enable HikariCP metrics
      auto-commit: false  # Disable auto-commit for optimal Hibernate performance
      connection-timeout: 2000
      minimum-idle: 5
      maximum-pool-size: 65

---
global:
  search:
    sort-field: id
    limit: 30
    sort-direction: asc

customer:
  search:
    sort-field: name
    limit: 20
    sort-direction: asc

# Flexy-Pool Configuration for HikariCP Metrics
decorator:
  datasource:
    enabled: true
    flexy-pool:
      metrics:
        reporter:
          micrometer:
            enabled: true
            auto-start: true

# application.yml
sql-performance:
  tracking:
    enabled: true
    fail-fast-on-error: false
    log-queries: true

---
logging:
  level:
    log4j.category.Hypersistence\ Optimizer: DEBUG